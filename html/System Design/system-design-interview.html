<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Design Interview Guide</title>
  <style>
    :root {
      --bg: #0f1117;
      --sidebar: #161b22;
      --panel: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --highlight: #1f6feb33;
      --code-bg: #0d1117;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      height: 100vh;
      overflow: hidden;
    }
    .layout { display: flex; height: 100vh; }
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .sidebar-header p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .topic-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .topic-list::-webkit-scrollbar { width: 6px; }
    .topic-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .topic-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      margin-bottom: 2px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .topic-item:hover { background: var(--highlight); color: var(--text); }
    .topic-item.active {
      background: var(--highlight);
      color: var(--accent);
      font-weight: 500;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 40px 48px;
      max-width: 900px;
    }
    .content::-webkit-scrollbar { width: 8px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .welcome {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .welcome h2 { font-size: 1.8rem; color: var(--text); margin-bottom: 12px; }
    .welcome p { max-width: 500px; margin: 0 auto; }
    .topic-content h2 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .topic-content .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .topic-content h3 {
      font-size: 1.15rem;
      color: var(--accent);
      margin: 28px 0 12px;
    }
    .topic-content h4 {
      font-size: 1rem;
      color: var(--text);
      margin: 20px 0 8px;
    }
    .topic-content p { margin-bottom: 14px; color: #c9d1d9; }
    .topic-content ul, .topic-content ol {
      margin: 0 0 16px 24px;
      color: #c9d1d9;
    }
    .topic-content li { margin-bottom: 6px; }
    .topic-content strong { color: var(--text); }
    .topic-content code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      color: #ff7b72;
      border: 1px solid var(--border);
    }
    .topic-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0 20px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .topic-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: #c9d1d9;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin: 16px 0 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card h4 { margin: 0 0 8px; color: var(--accent); font-size: 0.95rem; }
    .card p { font-size: 0.88rem; margin: 0; }
    .interview-q {
      background: var(--panel);
      border-left: 3px solid var(--accent);
      padding: 14px 18px;
      margin: 16px 0;
      border-radius: 0 8px 8px 0;
    }
    .interview-q .q { font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .interview-q .a { color: #c9d1d9; font-size: 0.92rem; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .tag-blue { background: #1f6feb33; color: var(--accent); }
    .tag-green { background: #23863633; color: var(--success); }
    .tag-yellow { background: #9e6a0333; color: var(--warning); }
    .tag-red { background: #da363333; color: var(--danger); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 24px;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }
    th { background: var(--panel); color: var(--accent); font-weight: 600; }
    td { color: #c9d1d9; }
    .diagram {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin: 16px 0;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.4;
      overflow-x: auto;
      white-space: pre;
      color: #8b949e;
    }
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; min-width: unset; max-height: 40vh; }
      .content { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>System Design Interview</h1>
        <p>Comprehensive preparation guide</p>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="Search topics..." autocomplete="off">
      </div>
      <nav class="topic-list" id="topicList"></nav>
    </aside>
    <main class="content" id="contentPanel">
      <div class="welcome">
        <h2>System Design Interview Guide</h2>
        <p>Select a topic from the left panel to explore in-depth explanations, trade-offs, diagrams, and common interview questions.</p>
      </div>
    </main>
  </div>
  <script src="system-design-content.js"></script>
  <script>
    const topicList = document.getElementById('topicList');
    const contentPanel = document.getElementById('contentPanel');
    const searchInput = document.getElementById('search');
    let activeId = null;

    function renderSidebar(filter = '') {
      topicList.innerHTML = '';
      const q = filter.toLowerCase();
      Object.entries(TOPICS).forEach(([id, topic]) => {
        if (q && !topic.title.toLowerCase().includes(q)) return;
        const btn = document.createElement('button');
        btn.className = 'topic-item' + (id === activeId ? ' active' : '');
        btn.textContent = topic.title;
        btn.dataset.id = id;
        btn.onclick = () => showTopic(id);
        topicList.appendChild(btn);
      });
    }

    function showTopic(id) {
      activeId = id;
      const topic = TOPICS[id];
      if (!topic) return;
      contentPanel.innerHTML = '<div class="topic-content">' + topic.html + '</div>';
      renderSidebar(searchInput.value);
      contentPanel.scrollTop = 0;
      history.replaceState(null, '', '#' + id);
    }

    searchInput.addEventListener('input', e => renderSidebar(e.target.value));

    renderSidebar();
    const hash = location.hash.slice(1);
    if (hash && TOPICS[hash]) showTopic(hash);
  </script>
</body>
</html>
